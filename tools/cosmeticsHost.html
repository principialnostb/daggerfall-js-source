<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сервер косметики DFO</title>
<style>
:root { color-scheme: dark; background: #121417; color: #eee6d5; font: 16px system-ui, sans-serif }
main { max-width: 36rem; margin: 10vh auto; padding: 2rem; border: 1px solid #736545; background: #1c2025 }
h1 { margin-top: 0; color: #e7c979 }
label, input { display: block }
input { box-sizing: border-box; width: 100%; margin: .5rem 0 1rem; padding: .7rem }
button { padding: .55rem .8rem; margin-right: .4rem; cursor: pointer }
p { line-height: 1.5 }
</style>
<main>
<h1>Сервер косметики DFO</h1>
<p>Локальный сервис запущен. Направьте HTTPS-туннель или обратный прокси на этот локальный порт, затем укажите выданный публичный адрес.</p>
<label>Публичный адрес <input id="address" type="url" placeholder="https://cosmetics.example.com"></label>
<button id="check">Проверить адрес</button>
<button id="copy">Скопировать адрес</button>
<p id="status" role="status"></p>
</main>
<script type="module">
const address = document.querySelector('#address');
const status = document.querySelector('#status');
address.value = localStorage.getItem('cosmeticsPublicUrl') ?? '';
function publicUrl() {
  const url = new URL(address.value.trim());
  if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
    throw new Error('Укажите HTTPS-адрес без пути и параметров.');
  }
  return url.origin;
}
document.querySelector('#check').onclick = async () => {
  try {
    const url = publicUrl();
    status.textContent = 'Проверка…';
    const response = await fetch(url + '/health', { signal: AbortSignal.timeout(5000) });
    if (!response.ok || (await response.json()).service !== 'dfo-cosmetics') throw new Error('Адрес не отвечает как сервер косметики.');
    localStorage.setItem('cosmeticsPublicUrl', url);
    status.textContent = 'Адрес доступен. Передайте его игрокам.';
  } catch (error) { status.textContent = error.message; }
};
document.querySelector('#copy').onclick = async () => {
  try {
    const url = publicUrl();
    await navigator.clipboard.writeText(url);
    localStorage.setItem('cosmeticsPublicUrl', url);
    status.textContent = 'Адрес скопирован.';
  } catch (error) { status.textContent = error.message; }
};
</script>
</html>
