name: Animation integration checks

on:
  push:
    branches: [Dev]
    paths:
      - 'src/combat/fpArm.js'
      - 'src/formats/morrowind/mwWalkAnimationAssets.js'
      - 'src/systems/modSettings.js'
      - 'src/systems/features.js'
      - 'src/ui/settings/settingsMap.js'
      - 'test/formats/morrowind/mwwalkassets.test.js'
      - 'test/systems/org2_options.test.js'
      - 'test/systems/features.test.js'
      - '.github/workflows/animation-integration-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
