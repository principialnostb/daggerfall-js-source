name: Animation integration checks

on:
  push:
    branches: [Dev]
    paths:
      - 'src/combat/fpArm.js'
      - 'src/net/peer/peerBodies.js'
      - 'src/formats/morrowind/mwWalkAnimationAssets.js'
      - 'src/systems/modSettings.js'
      - 'src/systems/features.js'
      - 'src/ui/settings/settingsMap.js'
      - 'test/formats/morrowind/mwwalkassets.test.js'
      - 'test/formats/morrowind/mwanimsource.test.js'
      - 'test/formats/morrowind/fparm.test.js'
      - 'test/formats/morrowind/mwnpc9_creatures.test.js'
      - 'test/net/peer/mwbody1.test.js'
      - 'test/systems/org2_options.test.js'
      - 'test/systems/features.test.js'
      - '.github/workflows/animation-integration-check.yml'
  workflow_dispatch:

concurrency:
  group: animation-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npx eslint --no-cache src/combat/fpArm.js src/net/peer/peerBodies.js src/formats/morrowind/mwWalkAnimationAssets.js src/systems/modSettings.js src/systems/features.js src/ui/settings/settingsMap.js test/formats/morrowind/mwwalkassets.test.js test/systems/org2_options.test.js test/systems/features.test.js
      - run: npm run types
      - run: node --test test/formats/morrowind/mwwalkassets.test.js test/formats/morrowind/mwanimsource.test.js test/formats/morrowind/fparm.test.js test/formats/morrowind/mwnpc9_creatures.test.js test/net/peer/mwbody1.test.js test/systems/org2_options.test.js test/systems/features.test.js
      - run: npm run build
